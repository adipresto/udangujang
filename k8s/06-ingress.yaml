# Ingress SSR via IP publik mentah (HTTP, TANPA TLS/host).
# DEVIASI dari tiket UDMC-13 (yang minta TLS nip.io): owner pilih akses via
# public IP langsung (70.153.24.73), tanpa domain. Tanpa hostname, cert
# letsencrypt tidak bisa diterbitkan — jadi HTTP saja, tanpa blok `tls`.
# Kalau nanti ada domain: tambah host + tls certresolver letsencrypt
# (contoh di ~/k8s-obsidian/06-ingress.yaml).
#
# Routing (prefix diteruskan APA ADANYA ke SSR; rewrite ke route asli
# dikerjakan Next.js via rewrites() di apps/ssr/next.config.ts — asset
# /_next/... tetap jalan tanpa basePath):
#   http://70.153.24.73/pesanudang[/...] -> ssr:3000 -> /pesan[/...]
#   http://70.153.24.73/atminudang[/...] -> ssr:3000 -> /admin[/...]
# Prefix lain (/) TIDAK dipakai — bebas untuk workload lain yang juga butuh
# ingress IP-based di port 80 ini.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ssr
  namespace: udangujang
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /pesanudang
            pathType: Prefix
            backend:
              service:
                name: ssr
                port:
                  number: 3000
          - path: /atminudang
            pathType: Prefix
            backend:
              service:
                name: ssr
                port:
                  number: 3000
