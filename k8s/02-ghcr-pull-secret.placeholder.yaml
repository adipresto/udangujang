# GHCR pull secret (UDMC-12). Dibuat manual SEKALI, tidak di-commit:
#   kubectl -n udangujang create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=adipresto \
#     --docker-password=<GITHUB_PAT_READ_PACKAGES> \
#     --docker-email=rizky.adie7@gmail.com
# PAT butuh scope read:packages. GITHUB_TOKEN Actions tidak bisa dipakai
# di sini (hanya hidup selama workflow run).
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-placeholder-DO-NOT-APPLY
  namespace: udangujang
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: REPLACE_ME_VIA_KUBECTL_CREATE_SECRET
