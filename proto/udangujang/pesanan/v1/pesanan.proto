syntax = "proto3";

package udangujang.pesanan.v1;

option go_package = "udangujang/das/internal/pb/udangujang/pesanan/v1;pesananv1";

import "google/protobuf/timestamp.proto";
import "udangujang/kastamer/v1/kastamer.proto";

// PesananService is storage-agnostic by design: no Firestore-specific types
// (document references, native Timestamp) belong here or in any future
// proto in this package — see docs/architecture.md. CreatePesanan is the
// only write path for new orders (public form and admin dashboard both
// call it, see docs/scenario.md) — it upserts Kastamer by no_hp and
// reuses-or-creates Alamat, then writes the Pesanan. ListPesanan,
// GetPesananDetail and UpdateStatusPesanan (UDMC-6) back the admin
// dashboard's pesanan list, detail panel, and status toggles.
service PesananService {
  rpc CreatePesanan(CreatePesananRequest) returns (CreatePesananResponse);
  rpc ListPesanan(ListPesananRequest) returns (ListPesananResponse);
  rpc GetPesananDetail(GetPesananDetailRequest) returns (GetPesananDetailResponse);
  rpc UpdateStatusPesanan(UpdateStatusPesananRequest) returns (UpdateStatusPesananResponse);
}

// PesananItem is one line item of a persisted Pesanan. harga/subtotal are
// whole Rupiah amounts (no fractional currency); qty stays a double since
// weight-based lines (kg) are fractional (e.g. 0.5) — see
// docs/migration-context.md § pesanan.
message PesananItem {
  string nama = 1;
  double qty = 2;
  string satuan = 3;
  int64 harga = 4;
  int64 subtotal = 5;
}

// Pesanan mirrors the pre-merge "pesanan" doc shape plus alamat_id (new —
// see docs/migration-context.md § pesanan). total_harga stays a formatted
// Rupiah STRING (not a number) for compatibility with the pre-merge
// dashboard schema, which already reads/writes it as a string.
message Pesanan {
  string id = 1;
  string kastamer_id = 2;
  string alamat_id = 3;
  repeated PesananItem items = 4;
  string deskripsi = 5;
  int64 ongkir = 6;
  string catatan_pesanan = 7;
  string metode_pembayaran = 8;
  string detail_pembayaran = 9;
  string metode_pengiriman = 10;
  string total_harga = 11;
  string status_pengiriman = 12;
  string status_pembayaran = 13;
  // status is the pre-merge doc's legacy free-form field — carried through
  // as-is, no new meaning assigned to it in this ticket.
  string status = 14;
  string kode_promo = 15;
  google.protobuf.Timestamp tanggal_antar = 16;
  google.protobuf.Timestamp tanggal_konfirmasi_antar = 17;
  google.protobuf.Timestamp tanggal_bayar = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
}

// PesananItemInput is the caller-supplied form of a line item — no
// subtotal (the server computes it from harga * qty).
message PesananItemInput {
  string nama = 1;
  double qty = 2;
  string satuan = 3;
  int64 harga = 4;
}

// CreatePesananRequest carries the full order payload: kastamer identity,
// destination alamat (either reused via alamat_id or matched/created from
// the alamat fields), items, and payment/shipping choices. This is the
// same shape the public form and the admin "tambah pesanan baru" form both
// submit — see docs/scenario.md.
message CreatePesananRequest {
  // Kastamer (upserted by no_hp — see docs/migration-context.md).
  string nama = 1;
  string no_hp = 2;
  string catatan = 3;

  // Alamat: if alamat_id is set and belongs to this kastamer, it is
  // reused as-is. Otherwise the server matches an existing Alamat with an
  // identical `alamat` string for this kastamer, reusing it; if none
  // matches, a new Alamat is created from these fields.
  string alamat_id = 4;
  string label = 5;
  string alamat = 6;
  double lat = 7;
  double lng = 8;
  string maps_link = 9;
  string wilayah_id = 10;

  repeated PesananItemInput items = 11;

  string metode_pembayaran = 12;
  string detail_pembayaran = 13;
  string metode_pengiriman = 14;
  string kode_promo = 15;
  google.protobuf.Timestamp tanggal_antar = 16;
  string deskripsi = 17;
  string catatan_pesanan = 18;
  int64 ongkir = 19;
}

message CreatePesananResponse {
  string pesanan_id = 1;
  Pesanan pesanan = 2;
}

// StatusLog is one audit-trail entry for a status change on a Pesanan —
// jenis_status is "pengiriman" or "pembayaran" (see
// docs/migration-context.md § pesanan).
message StatusLog {
  string id = 1;
  string pesanan_id = 2;
  string status_lama = 3;
  string status_baru = 4;
  string jenis_status = 5;
  google.protobuf.Timestamp changed_at = 6;
}

// ListPesananRequest narrows by delivery date range (tanggal_antar) and/or
// exact status match; unset fields mean "no filter" on that dimension.
// limit <= 0 means unlimited.
message ListPesananRequest {
  google.protobuf.Timestamp tanggal_dari = 1;
  google.protobuf.Timestamp tanggal_sampai = 2;
  string status_pengiriman = 3;
  string status_pembayaran = 4;
  int32 limit = 5;
}

message ListPesananResponse {
  repeated Pesanan pesanan = 1;
}

message GetPesananDetailRequest {
  string id = 1;
}

// GetPesananDetailResponse joins the Pesanan with its Kastamer, Alamat, and
// status_log — the admin dashboard's pesanan detail panel reads all four
// together (see docs/migration-context.md § pesanan).
message GetPesananDetailResponse {
  Pesanan pesanan = 1;
  udangujang.kastamer.v1.Kastamer kastamer = 2;
  udangujang.kastamer.v1.Alamat alamat = 3;
  repeated StatusLog status_log = 4;
}

// UpdateStatusPesananRequest changes only the status fields that are set —
// status_pengiriman/status_pembayaran are optional (proto3 presence), so a
// caller can flip just one without clobbering the other. See
// quickStatus()'s verbatim behavior in
// reference/udang-dashboard/index.html.
message UpdateStatusPesananRequest {
  string id = 1;
  optional string status_pengiriman = 2;
  optional string status_pembayaran = 3;
}

message UpdateStatusPesananResponse {
  Pesanan pesanan = 1;
}
